server:
  port: 8080

external:
  monolith:
    url: http://localhost:8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        ## Swagger
        - id: swagger-ui
          uri: ${external.monolith.url}
          predicates:
            - Path=/swagger-ui/**

        - id: swagger-api-docs
          uri: ${external.monolith.url}
          predicates:
            - Path=/v3/api-docs/**

        - id: swagger-config
          uri: ${external.monolith.url}
          predicates:
            - Path=/swagger-resources/**, /swagger-ui.html, /webjars/*

        - id: auth-public
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/auth/signup, /api/v1/auth/login

        - id: product-public
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/products, /api/v1/products/{productId}
            - Method=GET

        - id: category-public
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/categories, /api/v1/categories/{categoryId}
            - Method=GET

        - id: user-service
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/logout
          filters:
            - AuthorizationFilter

        - id: order-service
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/claims/**
          filters:
            - AuthorizationFilter

        - id: payment-service
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthorizationFilter

        - id: review-service
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - AuthorizationFilter

        - id: product-owner
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/owner/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: OWNER

        - id: product-manager
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/manager/products/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        - id: category-master
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/master/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MASTER

        - id: admin-users
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/admin/users/**, /api/v1/admin/owners/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        - id: admin-managers
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/admin/managers/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MASTER

        - id: admin-claims
          uri: ${external.monolith.url}
          predicates:
            - Path=/api/v1/admin/claims/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        - id: review-admin
          uri: ${external.monolith.url}
          predicates:
            - Path=/admin/reviews/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentPurposeOnly12345}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    com.example.gateway: DEBUG

