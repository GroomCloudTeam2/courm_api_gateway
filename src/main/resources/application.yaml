server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ???????????????????????????????????????????????????????
        # Public (?? ???)
        # ???????????????????????????????????????????????????????
        - id: auth-public
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/auth/signup, /api/v1/auth/login

        - id: product-public
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products, /api/v1/products/{productId}
            - Method=GET

        - id: category-public
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/categories, /api/v1/categories/{categoryId}
            - Method=GET

        # ???????????????????????????????????????????????????????
        # User Service (?? ??)
        # ???????????????????????????????????????????????????????
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/logout
          filters:
            - AuthorizationFilter

        # ???????????????????????????????????????????????????????
        # Order Service (?? ??)
        # ???????????????????????????????????????????????????????
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/claims/**
          filters:
            - AuthorizationFilter

        # ???????????????????????????????????????????????????????
        # Payment Service (?? ??)
        # ???????????????????????????????????????????????????????
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthorizationFilter

        # ???????????????????????????????????????????????????????
        # Review Service (?? ??)
        # ???????????????????????????????????????????????????????
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - AuthorizationFilter

        # ???????????????????????????????????????????????????????
        # Product - Owner ??
        # ???????????????????????????????????????????????????????
        - id: product-owner
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/owner/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: OWNER

        # ???????????????????????????????????????????????????????
        # Product - Manager ??
        # ???????????????????????????????????????????????????????
        - id: product-manager
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/manager/products/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        # ???????????????????????????????????????????????????????
        # Category - Master ??
        # ???????????????????????????????????????????????????????
        - id: category-master
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/master/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MASTER

        # ???????????????????????????????????????????????????????
        # Admin - User/Owner ?? (Manager)
        # ???????????????????????????????????????????????????????
        - id: admin-users
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/admin/users/**, /api/v1/admin/owners/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        # ???????????????????????????????????????????????????????
        # Admin - Manager ?? (Master ??)
        # ???????????????????????????????????????????????????????
        - id: admin-managers
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/admin/managers/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MASTER

        # ???????????????????????????????????????????????????????
        # Admin - Claims ?? (Manager)
        # ???????????????????????????????????????????????????????
        - id: admin-claims
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/admin/claims/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

        # ???????????????????????????????????????????????????????
        # Admin - Review (Manager)
        # ???????????????????????????????????????????????????????
        - id: review-admin
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/admin/reviews/**
          filters:
            - AuthorizationFilter
            - name: RoleAuthorizationFilter
              args:
                roles: MANAGER,MASTER

### JWT ###
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentPurposeOnly12345}

### Eureka Service ###
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

### ?? ###
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    com.example.gateway: DEBUG
